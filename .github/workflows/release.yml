name: Release

# Triggered by pushing a `v*` tag, OR manually with a version number.
# Manual dispatch creates the tag, which re-triggers this workflow to build
# and publish the GitHub Release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0, without the leading v)'
        required: true

permissions:
  contents: write

jobs:
  # On manual dispatch: create and push the v<version> tag. The tag push then
  # re-triggers this workflow (via the `push: tags` trigger) to build & publish.
  create-tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need write access to push a tag
          persist-credentials: true
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Create and push tag
        run: |
          VERSION="${{ inputs.version }}"
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Build dashboard
        working-directory: dashboard
        run: |
          npm ci
          npm run build

      - name: Package dashboard dist
        run: |
          TAG="${GITHUB_REF_NAME:-v0.1.0}"
          cd dashboard
          zip -r "$GITHUB_WORKSPACE/open-pc-dashboard-dist-${TAG}.zip" dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            open-pc-dashboard-dist-*.zip