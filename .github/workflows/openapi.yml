name: OpenAPI contract

# The committed `dashboard/openapi.json` is the contract the dashboard's TS SDK
# is generated from. The FastAPI server is the source of truth; this job fails
# if the committed spec drifts from the live server, mirroring SmolVM's
# `.github/workflows/openapi.yml` drift check.
on:
  push:
    branches: [main, master]
    paths:
      - 'docker/**'
      - 'dashboard/openapi.json'
      - 'scripts/dump_openapi.py'
      - '.github/workflows/openapi.yml'
  pull_request:
    branches: [main, master]

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install server deps (schema only, no display/pyautogui needed)
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic slowapi pillow

      - name: Re-dump OpenAPI spec
        run: python scripts/dump_openapi.py

      - name: Fail if the committed spec is stale
        run: |
          if ! git diff --exit-code dashboard/openapi.json; then
            echo "::error::dashboard/openapi.json is stale. Run: python scripts/dump_openapi.py && (cd dashboard && npm run generate)"
            exit 1
          fi