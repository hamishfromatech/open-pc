[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openpc-sdk"
version = "0.1.0"
description = "Python SDK for Open-PC Desktop Control"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "The A-Tech Corporation", email = "info@theatechcorporation.com"}
]
keywords = ["open-pc", "desktop-automation", "ai-agent", "screenshot", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[project.urls]
Homepage = "https://github.com/hamishfromatech/open-pc"
Documentation = "https://github.com/hamishfromatech/open-pc/tree/main/openpc-sdk/docs"
Repository = "https://github.com/hamishfromatech/open-pc"
Issues = "https://github.com/hamishfromatech/open-pc/issues"

[project.scripts]
openpc = "openpc_sdk.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["openpc_sdk*"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
