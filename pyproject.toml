[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Enable a sensible, broadly-used rule set
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes (unused imports, vars, etc.)
  "I",    # isort (import ordering)
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "SIM",  # flake8-simplify
]
ignore = [
  "E501",   # line too long (handled by formatter / not critical here)
  "B008",   # function calls in defaults (FastAPI patterns rely on this)
]

[tool.ruff.lint.per-file-ignores]
"docker/agent_server.py" = ["B008"]
"docker/desktop_manager.py" = ["E402"]  # pyautogui env var must be set before import